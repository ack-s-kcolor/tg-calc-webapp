<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Калькулятор заказа</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  #backBtn { margin-bottom: 12px; width: auto; padding: 8px 14px; }
  .btn-sm {
    width: auto;
    padding: 5px 10px;
    font-size: 12px;
    margin: 0;
  }
  .op-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 10px;
    font-size: 13px;
  }
  .op-row .op-info { display: flex; gap: 8px; align-items: baseline; }
  .op-row .op-info .name { font-weight: 400; }
  .op-row .op-info .sum { color: var(--tg-theme-hint-color, #999999); }
  .comp-actions {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    margin-bottom: 4px;
  }
  .comp-actions .btn-sm { flex: 1; text-align: center; }
  #summaryBar {
    font-size: 12px;
    color: var(--tg-theme-hint-color, #999999);
    background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 14px;
    line-height: 1.6;
  }
  #summaryBar b { color: var(--tg-theme-text-color, #000000); }
  #summaryBar:empty { display: none; margin: 0; padding: 0; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    padding: 14px;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .hint { font-size: 12px; color: var(--tg-theme-hint-color, #999999); margin: 4px 0 12px; }
  input[type=text], input[type=number] {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid var(--tg-theme-hint-color, #cccccc);
    background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    color: var(--tg-theme-text-color, #000000);
    outline: none;
    margin-bottom: 10px;
  }
  label { font-size: 13px; display: block; margin-bottom: 4px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .item, .btn {
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    color: var(--tg-theme-text-color, #000000);
    cursor: pointer;
    margin-bottom: 6px;
    border: none;
    font-size: 15px;
    width: 100%;
    text-align: left;
  }
  .item .rate {
    font-size: 12px;
    color: var(--tg-theme-hint-color, #999999);
    margin-top: 2px;
  }
  .btn-primary {
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
    text-align: center;
    font-weight: 500;
  }
  .list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .summary-line {
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    margin-bottom: 6px;
    font-size: 13px;
  }
  .summary-line .name { font-weight: 500; }
  .summary-line .sum { text-align: right; font-weight: 600; margin-top: 4px; }
  .total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    font-size: 16px;
    font-weight: 600;
    border-top: 1px solid var(--tg-theme-hint-color, #cccccc);
    margin-top: 8px;
  }
</style>
</head>
<body>

<button id="backBtn" class="btn secondary" style="display:none;">← Назад</button>
<div id="summaryBar"></div>
<div id="app"></div>

<script>
const tgRaw = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
// telegram-web-app.js создаёт объект WebApp даже в обычном браузере вне Telegram —
// поэтому проверяем не просто его наличие, а initData: он пустой вне Telegram
// и заполнен только при реальном запуске из мессенджера
const tg = (tgRaw && tgRaw.initData) ? tgRaw : null;
if (tg) {
  tg.ready();
  tg.expand();
}

let materials = [];
let operations = [];
let materialOperationsMap = {}; // { "название материала": ["операция1", ...] }

function getAllowedOperations(materialName) {
  const entry = materialOperationsMap[materialName];
  if (!entry) {
    // материала вообще нет в справочнике привязки — показываем все операции,
    // чтобы ничего не блокировать, если справочник ещё не заполнен
    return operations;
  }
  if (entry.no_operations) return [];
  if (entry.operations.length === 0) return operations;
  return operations.filter(o => entry.operations.includes(o.name));
}

function materialHasNoOperations(materialName) {
  const entry = materialOperationsMap[materialName];
  return !!(entry && entry.no_operations);
}

function proceedAfterMaterialSetup() {
  if (materialHasNoOperations(state.draft.material.name)) {
    finishComponent();
  } else {
    goToStep("operation_search");
  }
}

const state = {
  step: "product",
  product: { name: "", qty: 1, multi: null },
  components: [],
  draft: { material: null, height: 0, width: 0, qty: 1, ops: [] },
  opDraft: null
};

let stepHistory = [];
let expandedComponents = new Set(); // индексы компонентов, развёрнутых на финальном экране

function toggleComponentExpand(i) {
  if (expandedComponents.has(i)) expandedComponents.delete(i);
  else expandedComponents.add(i);
  render();
}

function goToStep(newStep) {
  stepHistory.push(state.step);
  state.step = newStep;
  render();
}

function goBack() {
  if (stepHistory.length === 0) return;
  state.step = stepHistory.pop();
  render();
}

function summaryHtml() {
  const parts = [];

  if (state.product.name) {
    parts.push(`<b>${state.product.name}</b> · тираж ${state.product.qty} шт`);
  }

  if (state.draft.material) {
    let matLine = `Материал: ${state.draft.material.name}`;
    if (state.draft.height || state.draft.width) {
      matLine += ` · ${state.draft.height || 0}x${state.draft.width || 0}мм, ${state.draft.qty} шт`;
    }
    parts.push(matLine);
  }

  if (state.draft.ops && state.draft.ops.length > 0) {
    const opsList = state.draft.ops.map(o => `${o.name} (${o.sum.toFixed(0)} руб)`).join(", ");
    parts.push(`Операции: ${opsList}`);
  }

  if (state.components.length > 0) {
    parts.push(`Готовых компонентов: ${state.components.length} (${grandTotal().toFixed(0)} руб.)`);
  }

  return parts.join("<br>");
}

function downloadXlsx(payload) {
  const rows = [];
  rows.push([payload.product.name || "Без названия"]);
  rows.push([`Тираж: ${payload.product.qty || 1} шт`]);
  rows.push([]);
  rows.push(["№", "Материал / Операция", "Сумма, руб."]);

  payload.components.forEach((c, i) => {
    rows.push([i + 1, c.material.name, Math.round(c.material_sum * 100) / 100]);
    c.operations.forEach(o => {
      rows.push(["", "    " + o.name, Math.round(o.sum * 100) / 100]);
    });
    rows.push(["", `Итого по компоненту ${i + 1}`, Math.round(c.component_sum * 100) / 100]);
    rows.push([]);
  });

  rows.push(["", "ИТОГО", Math.round(payload.total * 100) / 100]);

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{ wch: 6 }, { wch: 40 }, { wch: 16 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Расчёт");

  // Скрытый лист с полными данными — нужен, чтобы этот же файл можно было
  // загрузить обратно в калькулятор и продолжить редактирование, а не только
  // посмотреть цифры. Обычный человек его не видит и не трогает.
  const rawWs = XLSX.utils.aoa_to_sheet([[JSON.stringify(payload)]]);
  XLSX.utils.book_append_sheet(wb, rawWs, "RawData");
  wb.Workbook = wb.Workbook || {};
  wb.Workbook.Sheets = [
    { Hidden: 0 },
    { Hidden: 1 }
  ];

  const safeName = (payload.product.name || "order").trim().replace(/[\\/:*?"<>|]/g, "-").slice(0, 50);
  XLSX.writeFile(wb, `${safeName}.xlsx`);
}

function loadOrderFromXlsx(file) {
  const statusEl = document.getElementById("loadOrderStatus");
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const wb = XLSX.read(evt.target.result, { type: "array" });
      const rawSheet = wb.Sheets["RawData"];
      if (!rawSheet) throw new Error("no raw sheet");
      const cell = rawSheet["A1"];
      if (!cell || !cell.v) throw new Error("empty raw cell");
      const payload = JSON.parse(cell.v);

      state.product = {
        name: payload.product.name || "",
        qty: payload.product.qty || 1,
        multi: true // после загрузки всегда разрешаем добавлять ещё компоненты
      };
      state.components = payload.components.map(c => ({
        material: c.material,
        height: c.height_mm,
        width: c.width_mm,
        qty: c.qty,
        ops: (c.operations || []).map(o => ({
          name: o.name,
          mode: o.mode,
          rate: o.rate,
          length_m: o.length_m || 0,
          setup_cost: o.setup_cost || 0,
          sum: o.sum
        })),
        materialSum: c.material_sum
      }));
      stepHistory = [];
      goToStep("component_done");
    } catch (err) {
      statusEl.textContent = "Не удалось прочитать файл заказа — убедитесь, что это файл, скачанный из этого же калькулятора.";
    }
  };
  reader.readAsArrayBuffer(file);
}

function unitLabel(mode) {
  if (mode === "sqm") return "руб/м²";
  if (mode === "lm") return "руб/м.п.";
  return "руб/шт";
}

function area() {
  return (state.draft.height / 1000) * (state.draft.width / 1000);
}

function perimeter() {
  return 2 * (state.draft.height + state.draft.width) / 1000;
}

function materialSum() {
  const m = state.draft.material;
  if (!m) return 0;
  if (m.mode === "sqm") return area() * state.draft.qty * m.rate;
  if (m.mode === "lm") return (state.draft.material_length_m || 0) * state.draft.qty * m.rate;
  return state.draft.qty * m.rate;
}

function opSum(op) {
  if (op.mode === "sqm") return area() * state.draft.qty * op.rate + (op.setup_cost || 0);
  if (op.mode === "lm") return (op.length_m || 0) * state.draft.qty * op.rate + (op.setup_cost || 0);
  return state.draft.qty * op.rate + (op.setup_cost || 0);
}

function componentTotal(c) {
  let sum = c.materialSum;
  c.ops.forEach(o => sum += o.sum);
  return sum;
}

function grandTotal() {
  return state.components.reduce((s, c) => s + componentTotal(c), 0);
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  const backBtn = document.getElementById("backBtn");
  backBtn.style.display = stepHistory.length > 0 ? "block" : "none";
  backBtn.onclick = goBack;

  document.getElementById("summaryBar").innerHTML = summaryHtml();

  if (state.step === "product") {
    app.innerHTML = `
      <h1>Новое изделие</h1>
      <label>Название</label>
      <input type="text" id="p_name" placeholder="Например: Табличка 1850x500мм" value="${state.product.name}">
      <label>Тираж, шт</label>
      <input type="number" id="p_qty" value="${state.product.qty}" min="1">
      <button class="btn btn-primary" id="next">Далее</button>
      <div class="hint" style="margin-top:16px;">Или загрузите ранее сохранённый файл заказа (.xlsx):</div>
      <input type="file" id="loadOrderFile" accept=".xlsx">
      <div class="hint" id="loadOrderStatus"></div>
    `;
    document.getElementById("next").onclick = () => {
      state.product.name = document.getElementById("p_name").value.trim() || "Без названия";
      state.product.qty = parseInt(document.getElementById("p_qty").value) || 1;
      goToStep("type");
    };
    document.getElementById("loadOrderFile").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      loadOrderFromXlsx(file);
    });
    return;
  }

  if (state.step === "type") {
    app.innerHTML = `
      <h1>${state.product.name}</h1>
      <div class="hint">Изделие состоит из одного материала или из нескольких?</div>
      <button class="btn" id="single">Одиночное (один материал)</button>
      <button class="btn" id="multi">Многосоставное (несколько материалов)</button>
    `;
    document.getElementById("single").onclick = () => {
      state.product.multi = false;
      startComponent();
    };
    document.getElementById("multi").onclick = () => {
      state.product.multi = true;
      startComponent();
    };
    return;
  }

  if (state.step === "material_search") {
    renderSearchScreen(
      materials,
      "Компонент " + (state.components.length + 1) + ": материал",
      "Введите название материала...",
      (m) => {
        state.draft.material = { name: m.name, mode: m.mode, rate: m.rate };
        goToStep("dimensions");
      }
    );
    return;
  }

  if (state.step === "dimensions") {
    app.innerHTML = `
      <h1>Габариты компонента</h1>
      <div class="hint">${state.draft.material.name}</div>
      <div class="row">
        <div><label>Высота, мм</label><input type="number" id="d_h" value="${state.draft.height || ""}"></div>
        <div><label>Ширина, мм</label><input type="number" id="d_w" value="${state.draft.width || ""}"></div>
      </div>
      <label>Количество, шт</label>
      <input type="number" id="d_qty" value="${state.draft.qty}" min="1">
      <button class="btn btn-primary" id="next">Далее</button>
    `;
    document.getElementById("next").onclick = () => {
      state.draft.height = parseFloat(document.getElementById("d_h").value) || 0;
      state.draft.width = parseFloat(document.getElementById("d_w").value) || 0;
      state.draft.qty = parseInt(document.getElementById("d_qty").value) || 1;
      if (state.draft.material.mode === "lm") {
        goToStep("material_length");
      } else {
        proceedAfterMaterialSetup();
      }
    };
    return;
  }

  if (state.step === "material_length") {
    const perim = perimeter();
    const prefill = state.draft.material_length_m ? state.draft.material_length_m.toFixed(2) : perim.toFixed(2);
    app.innerHTML = `
      <h1>${state.draft.material.name}</h1>
      <div class="hint">Периметр по габаритам: ${perim.toFixed(2)} м на 1 шт</div>
      <label>Длина материала на 1 шт, м</label>
      <input type="number" step="0.01" id="mat_len" value="${prefill}">
      <div class="hint">Можно оставить расчётный периметр или ввести своё значение</div>
      <button class="btn btn-primary" id="next">Далее</button>
    `;
    document.getElementById("next").onclick = () => {
      state.draft.material_length_m = parseFloat(document.getElementById("mat_len").value) || 0;
      proceedAfterMaterialSetup();
    };
    return;
  }

  if (state.step === "operation_search") {
    const allowedOps = getAllowedOperations(state.draft.material.name);
    renderSearchScreen(
      allowedOps,
      "Операция",
      "Введите название операции...",
      (o) => {
        state.opDraft = { name: o.name, mode: o.mode, rate: o.rate, length_m: 0, setup_cost: 0 };
        if (o.mode === "lm") {
          goToStep("operation_length");
        } else {
          goToStep("operation_setup");
        }
      }
    );
    const skipBtn = document.createElement("button");
    skipBtn.className = "btn secondary";
    skipBtn.style.marginTop = "10px";
    skipBtn.textContent = state.draft.ops.length > 0
      ? "Готово, больше операций не нужно"
      : "Завершить без операций";
    skipBtn.onclick = () => finishComponent();
    app.appendChild(skipBtn);
    return;
  }

  if (state.step === "operation_length") {
    const perim = perimeter();
    app.innerHTML = `
      <h1>${state.opDraft.name}</h1>
      <div class="hint">Периметр по габаритам: ${perim.toFixed(2)} м на 1 шт</div>
      <label>Длина реза на 1 шт, м</label>
      <input type="number" step="0.01" id="op_len" value="${perim.toFixed(2)}">
      <div class="hint">Можно оставить расчётный периметр или ввести своё значение (если контур сложнее прямоугольника)</div>
      <button class="btn btn-primary" id="next">Далее</button>
    `;
    document.getElementById("next").onclick = () => {
      state.opDraft.length_m = parseFloat(document.getElementById("op_len").value) || 0;
      goToStep("operation_setup");
    };
    return;
  }

  if (state.step === "operation_setup") {
    app.innerHTML = `
      <h1>${state.opDraft.name}</h1>
      <label>Приладка, руб (0 если нет)</label>
      <input type="number" id="op_setup" value="0">
      <button class="btn btn-primary" id="next">Далее</button>
    `;
    document.getElementById("next").onclick = () => {
      state.opDraft.setup_cost = parseFloat(document.getElementById("op_setup").value) || 0;
      state.opDraft.sum = opSum(state.opDraft);
      state.draft.ops.push(state.opDraft);
      state.opDraft = null;
      goToStep("operation_more");
    };
    return;
  }

  if (state.step === "operation_more") {
    app.innerHTML = `
      <h1>Операция добавлена</h1>
      <div class="hint">Ещё одна операция для этого компонента?</div>
      <button class="btn" id="yes">Да, добавить операцию</button>
      <button class="btn btn-primary" id="no">Нет, компонент готов</button>
    `;
    document.getElementById("yes").onclick = () => {
      goToStep("operation_search");
    };
    document.getElementById("no").onclick = () => {
      finishComponent();
    };
    return;
  }

  if (state.step === "component_done") {
    const c = state.components[state.components.length - 1];
    let opsHtml = c.ops.map((o, opIdx) =>
      `<div class="op-row">
        <div class="op-info"><span class="name">${o.name}</span><span class="sum">${o.sum.toFixed(0)} руб.</span></div>
        <button class="btn btn-sm" onclick="deleteOperation(${state.components.length - 1}, ${opIdx})" style="background:#e5484d; color:#fff;">✕</button>
      </div>`
    ).join("");
    app.innerHTML = `
      <h1>Компонент готов</h1>
      <div class="summary-line"><div class="name">${c.material.name}</div><div class="sum">${c.materialSum.toFixed(0)} руб.</div></div>
      ${opsHtml}
      <div class="total"><span>Сумма компонента</span><span>${componentTotal(c).toFixed(0)} руб.</span></div>
      <div class="comp-actions" style="margin-top:10px;">
        <button class="btn btn-sm" id="editLast">Габариты</button>
        <button class="btn btn-sm" id="editMat">Материал</button>
        <button class="btn btn-sm" id="delComp" style="background:#e5484d; color:#fff;">Удалить</button>
      </div>
    `;
    if (state.product.multi) {
      app.innerHTML += `
        <button class="btn" id="more">Добавить компонент</button>
        <button class="btn btn-primary" id="done">Завершить изделие</button>
      `;
      document.getElementById("more").onclick = () => startComponent();
      document.getElementById("done").onclick = () => { goToStep("final"); };
    } else {
      app.innerHTML += `<button class="btn btn-primary" id="done">Завершить</button>`;
      document.getElementById("done").onclick = () => { goToStep("final"); };
    }
    document.getElementById("editLast").onclick = () => editComponent(state.components.length - 1);
    document.getElementById("editMat").onclick = () => editMaterial(state.components.length - 1);
    document.getElementById("delComp").onclick = () => deleteComponent(state.components.length - 1);
    return;
  }

  if (state.step === "final") {
    let compHtml = state.components.map((c, i) => {
      const isOpen = expandedComponents.has(i);
      const opsHtml = c.ops.map((o, opIdx) =>
        `<div class="op-row" style="margin-left:14px; border-left:2px solid var(--tg-theme-hint-color,#cccccc); padding-left:10px;">
          <div class="op-info"><span class="name">${o.name}</span><span class="sum">${o.sum.toFixed(0)} руб.</span></div>
          <button class="btn btn-sm" onclick="deleteOperation(${i}, ${opIdx})" style="background:#e5484d; color:#fff;">✕</button>
        </div>`
      ).join("");

      const detailsHtml = isOpen ? `
        <div class="summary-line" style="background:transparent; padding-top:2px; padding-bottom:0;">
          <div class="name">Материал: ${c.material.name}</div>
          <div class="sum">${c.materialSum.toFixed(0)} руб.</div>
        </div>
        ${opsHtml}
        <div class="comp-actions">
          <button class="btn btn-sm" onclick="editComponent(${i})">Габариты</button>
          <button class="btn btn-sm" onclick="editMaterial(${i})">Материал</button>
          <button class="btn btn-sm" onclick="deleteComponent(${i})" style="background:#e5484d; color:#fff;">Удалить</button>
        </div>
      ` : "";

      return `
        <div class="summary-line" style="cursor:pointer;" onclick="toggleComponentExpand(${i})">
          <div class="name">${isOpen ? "▼" : "▶"} ${i + 1}. ${c.material.name}</div>
          <div class="sum">${componentTotal(c).toFixed(0)} руб.</div>
        </div>
        ${detailsHtml}
      `;
    }).join("<div style='height:10px;'></div>");

    const payload = {
      product: state.product,
      components: state.components.map(c => ({
        material: c.material,
        height_mm: c.height,
        width_mm: c.width,
        qty: c.qty,
        material_sum: c.materialSum,
        operations: c.ops,
        component_sum: componentTotal(c)
      })),
      total: grandTotal()
    };

    const actionHtml = tg
      ? `<button class="btn btn-primary" id="send">Отправить расчёт в чат</button>`
      : `<button class="btn btn-primary" id="send">Скачать JSON расчёта</button>
         <button class="btn secondary" id="sendXlsx" style="margin-top:6px;">Скачать Excel</button>
         <div class="hint" style="margin-top:8px;">Страница открыта не в Telegram — расчёт показан ниже и его можно скачать файлом.</div>
         <pre style="margin-top:14px; background:var(--tg-theme-secondary-bg-color,#f2f2f2); border-radius:10px; padding:12px; font-size:12px; overflow-x:auto; white-space:pre-wrap; word-break:break-word;">${JSON.stringify(payload, null, 2)}</pre>`;

    app.innerHTML = `
      <h1>${state.product.name}</h1>
      <div class="hint">Тираж: ${state.product.qty} шт</div>
      ${compHtml}
      <div class="total"><span>Итого</span><span>${grandTotal().toFixed(0)} руб.</span></div>
      ${actionHtml}
    `;
    document.getElementById("send").onclick = () => {
      if (tg) {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      } else {
        const json = JSON.stringify(payload, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "order.json";
        a.click();
        URL.revokeObjectURL(url);
      }
    };
    if (!tg) {
      document.getElementById("sendXlsx").onclick = () => downloadXlsx(payload);
    }
    return;
  }
}

function deleteOperation(componentIndex, opIndex) {
  state.components[componentIndex].ops.splice(opIndex, 1);
  render();
}

function deleteComponent(index) {
  state.components.splice(index, 1);
  expandedComponents.clear();
  if (state.components.length === 0) {
    // все компоненты удалены — возвращаемся к выбору материала для нового
    startComponent();
  } else {
    goToStep(state.step === "component_done" ? "final" : state.step);
  }
}

function editComponent(index) {
  const c = state.components.splice(index, 1)[0];
  state.draft = {
    material: c.material,
    height: c.height,
    width: c.width,
    qty: c.qty,
    ops: c.ops,
    material_length_m: c.material_length_m || 0
  };
  stepHistory = [];
  goToStep("dimensions");
}

function editMaterial(index) {
  const c = state.components.splice(index, 1)[0];
  state.draft = {
    material: null,
    height: c.height,
    width: c.width,
    qty: c.qty,
    ops: c.ops,
    material_length_m: c.material_length_m || 0
  };
  stepHistory = [];
  goToStep("material_search");
}

function startComponent() {
  state.draft = { material: null, height: 0, width: 0, qty: 1, ops: [] };
  goToStep("material_search");
}

function finishComponent() {
  // пересчитываем суммы операций от текущих габаритов/количества —
  // важно, если компонент редактировался и размеры могли измениться
  state.draft.ops.forEach(op => { op.sum = opSum(op); });
  state.draft.materialSum = materialSum();
  state.components.push(state.draft);
  goToStep("component_done");
}

function renderSearchScreen(catalog, title, placeholder, onSelect) {
  const app = document.getElementById("app");
  app.innerHTML = `
    <h1>${title}</h1>
    <input type="text" id="q" placeholder="${placeholder}" autofocus>
    <div class="list" id="list"></div>
  `;
  const input = document.getElementById("q");
  const list = document.getElementById("list");

  function renderList(query) {
    const q = query.trim().toLowerCase();
    const filtered = catalog.filter(x => x.name.toLowerCase().includes(q));
    list.innerHTML = "";
    filtered.forEach((item) => {
      const div = document.createElement("button");
      div.className = "item";
      div.innerHTML = `<div>${item.name}</div><div class="rate">${item.rate} ${unitLabel(item.mode)}</div>`;
      div.addEventListener("click", () => onSelect(item));
      list.appendChild(div);
    });
    if (filtered.length === 0) {
      list.innerHTML = '<div class="hint">Ничего не найдено</div>';
    }
  }

  input.addEventListener("input", (e) => renderList(e.target.value));
  renderList("");
}

function fetchJsonSafe(url, fallback) {
  return fetch(url, { cache: "no-store" })
    .then(r => r.ok ? r.json() : fallback)
    .catch(() => fallback);
}

Promise.all([
  fetch("materials.json?v=" + Date.now(), { cache: "no-store" }).then(r => r.json()),
  fetch("operations.json?v=" + Date.now(), { cache: "no-store" }).then(r => r.json()),
  fetchJsonSafe("material_operations.json?v=" + Date.now(), [])
]).then(([m, o, link]) => {
  materials = m;
  operations = o;
  materialOperationsMap = {};
  link.forEach(entry => {
    materialOperationsMap[entry.material] = {
      operations: entry.operations || [],
      no_operations: !!entry.no_operations
    };
  });
  render();
}).catch(() => {
  document.getElementById("app").innerHTML = "<div class='hint'>Не удалось загрузить справочники</div>";
});
</script>
