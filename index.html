<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Калькулятор заказа</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  #stickyHeader {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--tg-theme-bg-color, #ffffff);
    padding-top: 14px;
    margin-top: -14px;
    padding-bottom: 6px;
  }
  #backBtn { margin-bottom: 12px; width: auto; padding: 8px 14px; }
  .op-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 10px;
    font-size: 13px;
  }
  .op-row .op-info { display: flex; flex-direction: column; gap: 1px; }
  .name-line { display: flex; gap: 8px; align-items: baseline; }
  .op-row .op-info .name-line { display: flex; gap: 8px; align-items: baseline; }
  .op-row .op-info .name { font-weight: 400; }
  .op-row .op-info .sum { color: var(--tg-theme-hint-color, #999999); }
  .op-row .op-info .detail { font-size: 11px; color: var(--tg-theme-hint-color, #999999); }
  .summary-line .detail { font-size: 11px; color: var(--tg-theme-hint-color, #999999); margin-top: 2px; }
  .comp-actions {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    margin-bottom: 4px;
  }
  .comp-actions .btn-sm { flex: 1; text-align: center; }
  .icon-btn {
    width: 32px;
    height: 32px;
    padding: 0;
    border-radius: 50%;
    border: none;
    background: var(--tg-theme-secondary-bg-color, #e5e5e5);
    color: var(--tg-theme-text-color, #000000);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon-btn-danger {
    background: #e5484d;
    color: #fff;
  }
  #summaryBar {
    font-size: 12px;
    color: var(--tg-theme-hint-color, #999999);
    background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 14px;
    line-height: 1.6;
  }
  #summaryBar b { color: var(--tg-theme-text-color, #000000); }
  #summaryBar:empty { display: none; margin: 0; padding: 0; }
  .context-menu {
    display: none;
    position: absolute;
    background: var(--tg-theme-bg-color, #ffffff);
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    padding: 6px;
    z-index: 200;
    min-width: 200px;
  }
  .context-menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 10px 12px;
    font-size: 14px;
    border-radius: 8px;
    cursor: pointer;
    margin: 0;
    color: var(--tg-theme-text-color, #000000);
  }
  .context-menu button:active {
    background: var(--tg-theme-secondary-bg-color, #f2f2f2);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    padding: 14px;
  }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .hint { font-size: 12px; color: var(--tg-theme-hint-color, #999999); margin: 4px 0 12px; }
  input[type=text], input[type=number] {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid var(--tg-theme-hint-color, #cccccc);
    background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    color: var(--tg-theme-text-color, #000000);
    outline: none;
    margin-bottom: 10px;
  }
  label { font-size: 13px; display: block; margin-bottom: 4px; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .compact-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  .compact-field { flex: 1; min-width: 70px; max-width: 110px; }
  .compact-field label { font-size: 10px; margin-bottom: 2px; color: var(--tg-theme-hint-color, #999999); }
  input.inline-num[type=number] {
    width: 64px;
    padding: 5px 6px;
    font-size: 12px;
    border-radius: 6px;
    border: 1px solid var(--tg-theme-hint-color, #cccccc);
    background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    color: var(--tg-theme-text-color, #000000);
  }
  .compact-field input {
    width: 100%;
    padding: 6px 8px;
    font-size: 13px;
    border-radius: 8px;
    border: 1px solid var(--tg-theme-hint-color, #cccccc);
    background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    color: var(--tg-theme-text-color, #000000);
  }
  .item, .btn {
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    color: var(--tg-theme-text-color, #000000);
    cursor: pointer;
    margin-bottom: 6px;
    border: none;
    font-size: 15px;
    width: 100%;
    text-align: left;
  }
  .btn-sm {
    width: auto;
    padding: 5px 10px;
    font-size: 12px;
    margin: 0;
    text-align: center;
  }
  .item .rate {
    font-size: 12px;
    color: var(--tg-theme-hint-color, #999999);
    margin-top: 2px;
  }
  .btn-primary {
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
    text-align: center;
    font-weight: 500;
  }
  .list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .summary-line {
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    margin-bottom: 6px;
    font-size: 13px;
  }
  .summary-line .name { font-weight: 500; }
  .summary-line .sum { text-align: right; font-weight: 600; margin-top: 4px; }
  .total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    font-size: 16px;
    font-weight: 600;
    border-top: 1px solid var(--tg-theme-hint-color, #cccccc);
    margin-top: 8px;
  }
</style>
</head>
<body>

<div id="stickyHeader">
  <button id="backBtn" class="btn secondary" style="display:none;">← Назад</button>
  <div id="summaryBar"></div>
</div>
<div id="app"></div>

<script>
const tgRaw = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
// telegram-web-app.js создаёт объект WebApp даже в обычном браузере вне Telegram —
// поэтому проверяем не просто его наличие, а initData: он пустой вне Telegram
// и заполнен только при реальном запуске из мессенджера
const tg = (tgRaw && tgRaw.initData) ? tgRaw : null;
if (tg) {
  tg.ready();
  tg.expand();
}

let materials = [];
let operations = [];
let materialOperationsMap = {}; // { "название материала": ["операция1", ...] }
let templates = []; // [{ name, payload }]

function getAllowedOperations(materialName) {
  const entry = materialOperationsMap[materialName];
  if (!entry) {
    // материала вообще нет в справочнике привязки — показываем все операции,
    // чтобы ничего не блокировать, если справочник ещё не заполнен
    return operations;
  }
  if (entry.no_operations) return [];
  if (entry.operations.length === 0) return operations;
  return operations.filter(o => entry.operations.includes(o.name));
}

function materialHasNoOperations(materialName) {
  const entry = materialOperationsMap[materialName];
  return !!(entry && entry.no_operations);
}

function checkOperationsCompatibility(materialName) {
  if (!state.draft.ops || state.draft.ops.length === 0) return;
  const allowedNames = materialHasNoOperations(materialName)
    ? []
    : getAllowedOperations(materialName).map(o => o.name);
  const incompatible = state.draft.ops.filter(op => !allowedNames.includes(op.name));
  if (incompatible.length > 0) {
    const names = incompatible.map(op => op.name).join(", ");
    const msg = `Внимание: операции «${names}» обычно не применяются к материалу «${materialName}». Они остались в компоненте — проверьте и уберите вручную, если не нужны.`;
    if (tg && tg.showAlert) {
      tg.showAlert(msg);
    } else {
      alert(msg);
    }
  }
}

function proceedAfterMaterialSetup() {
  if (materialHasNoOperations(state.draft.material.name)) {
    finishComponent();
  } else {
    goToStep("operation_search");
  }
}

const state = {
  step: "product",
  product: { name: "", qty: 1, multi: null },
  components: [],
  draft: { material: null, height: 0, width: 0, qty: 1, ops: [] },
  opDraft: null
};

let stepHistory = [];
let expandedComponents = new Set(); // индексы компонентов, развёрнутых на финальном экране

function toggleComponentExpand(i) {
  if (expandedComponents.has(i)) expandedComponents.delete(i);
  else expandedComponents.add(i);
  render();
}

function goToStep(newStep) {
  stepHistory.push(state.step);
  state.step = newStep;
  render();
}

function goBack() {
  if (stepHistory.length === 0) return;
  state.step = stepHistory.pop();
  render();
}

function summaryHtml() {
  const parts = [];

  if (state.product.name) {
    parts.push(`<b>${state.product.name}</b> · тираж ${state.product.qty} шт`);
  }

  if (state.draft.material) {
    let matLine = `Материал: ${state.draft.material.name}`;
    if (state.draft.height || state.draft.width) {
      matLine += ` · ${state.draft.height || 0}x${state.draft.width || 0}мм, ${state.draft.qty} шт`;
    }
    parts.push(matLine);
  }

  if (state.draft.ops && state.draft.ops.length > 0) {
    const opsList = state.draft.ops.map(o => `${o.name} (${o.sum.toFixed(0)} руб)`).join(", ");
    parts.push(`Операции: ${opsList}`);
  }

  if (state.components.length > 0) {
    parts.push(`Готовых компонентов: ${state.components.length} (${grandTotal().toFixed(0)} руб.)`);
  }

  return parts.join("<br>");
}

function downloadXlsx(payload) {
  const rows = [];
  rows.push([payload.product.name || "Без названия"]);
  rows.push([`Тираж: ${payload.product.qty || 1} шт`]);
  rows.push([]);
  rows.push(["№", "Материал / Операция", "Сумма, руб."]);

  payload.components.forEach((c, i) => {
    rows.push([i + 1, c.material.name, Math.round(c.material_sum * 100) / 100]);
    c.operations.forEach(o => {
      rows.push(["", "    " + o.name, Math.round(o.sum * 100) / 100]);
    });
    rows.push(["", `Итого по компоненту ${i + 1}`, Math.round(c.component_sum * 100) / 100]);
    rows.push([]);
  });

  rows.push(["", "ИТОГО", Math.round(payload.total * 100) / 100]);

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{ wch: 6 }, { wch: 40 }, { wch: 16 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Расчёт");

  // Скрытый лист с полными данными — нужен, чтобы этот же файл можно было
  // загрузить обратно в калькулятор и продолжить редактирование, а не только
  // посмотреть цифры. Обычный человек его не видит и не трогает.
  const rawWs = XLSX.utils.aoa_to_sheet([[JSON.stringify(payload)]]);
  XLSX.utils.book_append_sheet(wb, rawWs, "RawData");
  wb.Workbook = wb.Workbook || {};
  wb.Workbook.Sheets = [
    { Hidden: 0 },
    { Hidden: 1 }
  ];

  const safeName = (payload.product.name || "order").trim().replace(/[\\/:*?"<>|]/g, "-").slice(0, 50);
  XLSX.writeFile(wb, `${safeName}.xlsx`);
}

function applyOrderPayload(payload) {
  state.product = {
    name: payload.product.name || "",
    qty: payload.product.qty || 1,
    multi: true // после загрузки всегда разрешаем добавлять ещё компоненты
  };
  state.components = payload.components.map(c => ({
    material: c.material,
    height: c.height_mm,
    width: c.width_mm,
    qty: c.qty,
    material_length_m: c.material_length_m || 0,
    ops: (c.operations || []).map(o => ({
      name: o.name,
      mode: o.mode,
      rate: o.rate,
      length_m: o.length_m || 0,
      setup_cost: o.setup_cost || 0,
      grommet_count: o.grommet_count || 0,
      spacing_cm: o.spacing_cm || 30,
      min_cost: o.min_cost || 0,
      sum: o.sum
    })),
    materialSum: c.material_sum
  }));
  stepHistory = [];
  goToStep("component_done");
}

function loadOrderFromXlsx(file) {
  const statusEl = document.getElementById("loadOrderStatus");
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const wb = XLSX.read(evt.target.result, { type: "array" });
      const rawSheet = wb.Sheets["RawData"];
      if (!rawSheet) throw new Error("no raw sheet");
      const cell = rawSheet["A1"];
      if (!cell || !cell.v) throw new Error("empty raw cell");
      const payload = JSON.parse(cell.v);
      applyOrderPayload(payload);
    } catch (err) {
      statusEl.textContent = "Не удалось прочитать файл заказа — убедитесь, что это файл, скачанный из этого же калькулятора.";
    }
  };
  reader.readAsArrayBuffer(file);
}

function unitLabel(mode) {
  if (mode === "sqm") return "руб/м²";
  if (mode === "lm") return "руб/м.п.";
  if (mode === "grommet") return "руб/люверс";
  return "руб/шт";
}

function area() {
  return (state.draft.height / 1000) * (state.draft.width / 1000);
}

function perimeter() {
  return 2 * (state.draft.height + state.draft.width) / 1000;
}

function materialSum() {
  const m = state.draft.material;
  if (!m) return 0;
  if (m.mode === "sqm") return area() * state.product.qty * m.rate;
  if (m.mode === "lm") return (state.draft.material_length_m || 0) * state.product.qty * m.rate;
  return state.product.qty * m.rate;
}

function opSum(op) {
  let raw;
  if (op.mode === "sqm") raw = area() * state.product.qty * op.rate + (op.setup_cost || 0);
  else if (op.mode === "lm") raw = (op.length_m || 0) * state.product.qty * op.rate + (op.setup_cost || 0);
  else if (op.mode === "grommet") raw = (op.grommet_count || 0) * state.product.qty * op.rate + (op.setup_cost || 0);
  else raw = state.product.qty * op.rate + (op.setup_cost || 0);
  return op.min_cost ? Math.max(raw, op.min_cost) : raw;
}

function componentTotal(c) {
  let sum = c.materialSum;
  c.ops.forEach(o => sum += o.sum);
  return sum;
}

function grandTotal() {
  return state.components.reduce((s, c) => s + componentTotal(c), 0);
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  const backBtn = document.getElementById("backBtn");
  backBtn.style.display = stepHistory.length > 0 ? "block" : "none";
  backBtn.onclick = goBack;

  document.getElementById("summaryBar").innerHTML = summaryHtml();

  if (state.step === "product") {
    const tplHtml = templates.length > 0
      ? `
        <div class="hint" style="margin-top:16px;">Или начните с готового шаблона типового заказа:</div>
        <div class="list" id="tplList"></div>
      `
      : "";
    app.innerHTML = `
      <h1>Новое изделие</h1>
      <label>Название</label>
      <input type="text" id="p_name" placeholder="Например: Табличка 1850x500мм" value="${state.product.name}">
      <label>Тираж, шт</label>
      <input type="number" id="p_qty" value="${state.product.qty}" min="1">
      <button class="btn btn-primary" id="next">Далее</button>
      ${tplHtml}
      <div class="hint" style="margin-top:16px;">Или загрузите ранее сохранённый файл заказа (.xlsx):</div>
      <input type="file" id="loadOrderFile" accept=".xlsx">
      <div class="hint" id="loadOrderStatus"></div>
    `;
    document.getElementById("next").onclick = () => {
      state.product.name = document.getElementById("p_name").value.trim() || "Без названия";
      state.product.qty = parseInt(document.getElementById("p_qty").value) || 1;
      state.product.multi = true;
      goToStep("final");
    };
    document.getElementById("loadOrderFile").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      loadOrderFromXlsx(file);
    });
    if (templates.length > 0) {
      const tplList = document.getElementById("tplList");
      templates.forEach((tpl) => {
        const btn = document.createElement("button");
        btn.className = "item";
        const compCount = (tpl.payload.components || []).length;
        btn.innerHTML = `<div>${tpl.name}</div><div class="rate">${compCount} компон. · ${tpl.payload.total || 0} руб.</div>`;
        btn.addEventListener("click", () => applyOrderPayload(tpl.payload));
        tplList.appendChild(btn);
      });
    }
    return;
  }

  if (state.step === "type") {
    app.innerHTML = `
      <h1>${state.product.name}</h1>
      <div class="hint">Изделие состоит из одного материала или из нескольких?</div>
      <button class="btn" id="single">Одиночное (один материал)</button>
      <button class="btn" id="multi">Многосоставное (несколько материалов)</button>
    `;
    document.getElementById("single").onclick = () => {
      state.product.multi = false;
      goToStep("final");
    };
    document.getElementById("multi").onclick = () => {
      state.product.multi = true;
      goToStep("final");
    };
    return;
  }

  if (state.step === "material_search") {
    renderSearchScreen(
      materials,
      "Компонент " + (state.components.length + 1) + ": материал",
      "Введите название материала...",
      (m) => {
        state.draft.material = { name: m.name, mode: m.mode, rate: m.rate };
        checkOperationsCompatibility(m.name);
        finishComponent();
      }
    );
    return;
  }

  if (state.step === "dimensions") {
    app.innerHTML = `
      <h1>Габариты компонента</h1>
      <div class="hint">${state.draft.material.name}</div>
      <div class="row">
        <div><label>Высота, мм</label><input type="number" id="d_h" value="${state.draft.height || ""}"></div>
        <div><label>Ширина, мм</label><input type="number" id="d_w" value="${state.draft.width || ""}"></div>
      </div>
      <label>Количество, шт</label>
      <input type="number" id="d_qty" value="${state.draft.qty}" min="1">
      <button class="btn btn-primary" id="next">Далее</button>
    `;
    document.getElementById("next").onclick = () => {
      state.draft.height = parseFloat(document.getElementById("d_h").value) || 0;
      state.draft.width = parseFloat(document.getElementById("d_w").value) || 0;
      state.draft.qty = parseInt(document.getElementById("d_qty").value) || 1;
      if (state.draft.material.mode === "lm") {
        goToStep("material_length");
      } else {
        finishComponent();
      }
    };
    return;
  }

  if (state.step === "material_length") {
    const perim = perimeter();
    const prefill = state.draft.material_length_m ? state.draft.material_length_m.toFixed(2) : perim.toFixed(2);
    app.innerHTML = `
      <h1>${state.draft.material.name}</h1>
      <div class="hint">Периметр по габаритам: ${perim.toFixed(2)} м на 1 шт</div>
      <label>Длина материала на 1 шт, м</label>
      <input type="number" step="0.01" id="mat_len" value="${prefill}">
      <div class="hint">Можно оставить расчётный периметр или ввести своё значение</div>
      <button class="btn btn-primary" id="next">Далее</button>
    `;
    document.getElementById("next").onclick = () => {
      state.draft.material_length_m = parseFloat(document.getElementById("mat_len").value) || 0;
      finishComponent();
    };
    return;
  }

  if (state.step === "edit_operation_length") {
    const { componentIndex, opIndex } = state.editingOp;
    const c = state.components[componentIndex];
    const op = c.ops[opIndex];
    const perim = perimeterFor(c);
    app.innerHTML = `
      <h1>${op.name}</h1>
      <div class="hint">${c.material.name} · ${c.height}x${c.width}мм, ${c.qty} шт</div>
      <div class="hint">Периметр по габаритам компонента: ${perim.toFixed(2)} м на 1 шт</div>
      <label>Длина реза на 1 шт, м</label>
      <input type="number" step="0.01" id="edit_op_len" value="${(op.length_m || 0).toFixed(2)}">
      <button class="btn btn-primary" id="save">Сохранить</button>
      <button class="btn secondary" id="usePerim">Использовать периметр (${perim.toFixed(2)} м)</button>
    `;
    document.getElementById("save").onclick = () => {
      op.length_m = parseFloat(document.getElementById("edit_op_len").value) || 0;
      op.sum = opSumFor(c, op);
      goBack();
    };
    document.getElementById("usePerim").onclick = () => {
      op.length_m = perim;
      op.sum = opSumFor(c, op);
      goBack();
    };
    return;
  }

  if (state.step === "edit_operation_rate") {
    const { componentIndex, opIndex } = state.editingOp;
    const c = state.components[componentIndex];
    const op = c.ops[opIndex];
    const area = (c.height / 1000) * (c.width / 1000);
    app.innerHTML = `
      <h1>${op.name}</h1>
      <div class="hint">${c.material.name} · ${c.height}x${c.width}мм, ${c.qty} шт · площадь на 1 шт: ${area.toFixed(4)} м²</div>
      <label>Тариф, руб/м²</label>
      <input type="number" step="0.01" id="edit_op_rate" value="${op.rate}">
      <label>Приладка, руб</label>
      <input type="number" step="0.01" id="edit_op_setup" value="${op.setup_cost || 0}">
      <button class="btn btn-primary" id="save">Сохранить</button>
    `;
    document.getElementById("save").onclick = () => {
      op.rate = parseFloat(document.getElementById("edit_op_rate").value) || 0;
      op.setup_cost = parseFloat(document.getElementById("edit_op_setup").value) || 0;
      op.sum = opSumFor(c, op);
      goBack();
    };
    return;
  }

  if (state.step === "edit_operation_grommet") {
    const { componentIndex, opIndex } = state.editingOp;
    const c = state.components[componentIndex];
    const op = c.ops[opIndex];
    const perim = perimeterFor(c);
    const computeCount = (spacingCm) => Math.ceil(perim / (spacingCm / 100));
    app.innerHTML = `
      <h1>${op.name}</h1>
      <div class="hint">${c.material.name} · ${c.height}x${c.width}мм, ${c.qty} шт · периметр на 1 шт: ${perim.toFixed(2)} м</div>
      <div style="display:flex; gap:8px; margin-bottom:10px;">
        <button class="btn" id="spacing30" style="flex:1;">Шаг 30 см</button>
        <button class="btn" id="spacing50" style="flex:1;">Шаг 50 см</button>
      </div>
      <label>Количество люверсов на 1 шт</label>
      <input type="number" id="edit_grommet_count" value="${op.grommet_count || 0}">
      <label>Тариф, руб/люверс</label>
      <input type="number" step="0.01" id="edit_grommet_rate" value="${op.rate}">
      <label>Приладка, руб</label>
      <input type="number" step="0.01" id="edit_grommet_setup" value="${op.setup_cost || 0}">
      <button class="btn btn-primary" id="save">Сохранить</button>
    `;
    document.getElementById("spacing30").onclick = () => {
      op.spacing_cm = 30;
      document.getElementById("edit_grommet_count").value = computeCount(30);
    };
    document.getElementById("spacing50").onclick = () => {
      op.spacing_cm = 50;
      document.getElementById("edit_grommet_count").value = computeCount(50);
    };
    document.getElementById("save").onclick = () => {
      op.grommet_count = parseInt(document.getElementById("edit_grommet_count").value) || 0;
      op.rate = parseFloat(document.getElementById("edit_grommet_rate").value) || 0;
      op.setup_cost = parseFloat(document.getElementById("edit_grommet_setup").value) || 0;
      op.sum = opSumFor(c, op);
      goBack();
    };
    return;
  }

  if (state.step === "operation_search") {
    const allowedOps = getAllowedOperations(state.draft.material.name);
    renderSearchScreen(
      allowedOps,
      "Операция",
      "Введите название операции...",
      (o) => {
        state.opDraft = { name: o.name, mode: o.mode, rate: o.rate, length_m: 0, setup_cost: 0, grommet_count: 0, spacing_cm: 30, min_cost: o.min_cost || 0 };
        if (o.mode === "lm") {
          state.opDraft.length_m = perimeter();
        } else if (o.mode === "grommet") {
          state.opDraft.grommet_count = Math.ceil(perimeter() / 0.3);
        }
        state.opDraft.sum = opSum(state.opDraft);
        state.draft.ops.push(state.opDraft);
        state.opDraft = null;
        finishComponent();
      }
    );
    const skipBtn = document.createElement("button");
    skipBtn.className = "btn secondary";
    skipBtn.style.marginTop = "10px";
    skipBtn.textContent = state.draft.ops.length > 0
      ? "Готово, больше операций не нужно"
      : "Завершить без операций";
    skipBtn.onclick = () => finishComponent();
    app.appendChild(skipBtn);
    return;
  }

  if (state.step === "operation_length") {
    const perim = perimeter();
    app.innerHTML = `
      <h1>${state.opDraft.name}</h1>
      <div class="hint">Периметр по габаритам: ${perim.toFixed(2)} м на 1 шт</div>
      <label>Длина реза на 1 шт, м</label>
      <input type="number" step="0.01" id="op_len" value="${perim.toFixed(2)}">
      <div class="hint">Можно оставить расчётный периметр или ввести своё значение (если контур сложнее прямоугольника)</div>
      <button class="btn btn-primary" id="next">Далее</button>
    `;
    document.getElementById("next").onclick = () => {
      state.opDraft.length_m = parseFloat(document.getElementById("op_len").value) || 0;
      state.opDraft.sum = opSum(state.opDraft);
      state.draft.ops.push(state.opDraft);
      state.opDraft = null;
      finishComponent();
    };
    return;
  }

  if (state.step === "operation_grommet") {
    const perim = perimeter();
    const computeCount = (spacingCm) => Math.ceil(perim / (spacingCm / 100));

    app.innerHTML = `
      <h1>${state.opDraft.name}</h1>
      <div class="hint">Периметр по габаритам: ${perim.toFixed(2)} м на 1 шт</div>
      <div style="display:flex; gap:8px; margin-bottom:10px;">
        <button class="btn" id="spacing30" style="flex:1;">Шаг 30 см</button>
        <button class="btn" id="spacing50" style="flex:1;">Шаг 50 см</button>
      </div>
      <label>Количество люверсов на 1 шт</label>
      <input type="number" id="grommet_count" value="${computeCount(state.opDraft.spacing_cm || 30)}">
      <div class="hint">Расчёт: периметр / шаг, округление вверх. Можно поправить вручную.</div>
      <button class="btn btn-primary" id="next">Далее</button>
    `;
    document.getElementById("spacing30").onclick = () => {
      state.opDraft.spacing_cm = 30;
      document.getElementById("grommet_count").value = computeCount(30);
    };
    document.getElementById("spacing50").onclick = () => {
      state.opDraft.spacing_cm = 50;
      document.getElementById("grommet_count").value = computeCount(50);
    };
    document.getElementById("next").onclick = () => {
      state.opDraft.grommet_count = parseInt(document.getElementById("grommet_count").value) || 0;
      state.opDraft.sum = opSum(state.opDraft);
      state.draft.ops.push(state.opDraft);
      state.opDraft = null;
      finishComponent();
    };
    return;
  }

  if (state.step === "operation_setup") {
    app.innerHTML = `
      <h1>${state.opDraft.name}</h1>
      <label>Приладка, руб (0 если нет)</label>
      <input type="number" id="op_setup" value="0">
      <button class="btn btn-primary" id="next">Далее</button>
    `;
    document.getElementById("next").onclick = () => {
      state.opDraft.setup_cost = parseFloat(document.getElementById("op_setup").value) || 0;
      state.opDraft.sum = opSum(state.opDraft);
      state.draft.ops.push(state.opDraft);
      state.opDraft = null;
      goToStep("operation_more");
    };
    return;
  }

  if (state.step === "operation_more") {
    app.innerHTML = `
      <h1>Операция добавлена</h1>
      <div class="hint">Ещё одна операция для этого компонента?</div>
      <button class="btn" id="yes">Да, добавить операцию</button>
      <button class="btn btn-primary" id="no">Нет, компонент готов</button>
    `;
    document.getElementById("yes").onclick = () => {
      goToStep("operation_search");
    };
    document.getElementById("no").onclick = () => {
      finishComponent();
    };
    return;
  }

  if (state.step === "component_done") {
    const c = state.components[state.components.length - 1];
    let opsHtml = c.ops.map((o, opIdx) => {
      const editBtn = o.mode === "lm"
        ? `<button class="btn btn-sm" onclick="editOperationLength(${state.components.length - 1}, ${opIdx})">✎</button>`
        : (o.mode === "sqm"
          ? `<button class="btn btn-sm" onclick="editOperationRate(${state.components.length - 1}, ${opIdx})">✎</button>`
          : (o.mode === "grommet"
            ? `<button class="btn btn-sm" onclick="editOperationGrommet(${state.components.length - 1}, ${opIdx})">✎</button>`
            : ""));
      const detail = calcDetailText(o.mode, o.rate, areaFor(c), o.length_m, c.height, c.width, o.grommet_count, o.spacing_cm, o.min_cost, o.sum);
      return `<div class="op-row">
        <div class="op-info">
          <div class="name-line"><span class="name">${o.name}</span><span class="sum">${o.sum.toFixed(0)} руб.</span></div>
          <div class="detail">${detail}${o.setup_cost ? ` + приладка ${o.setup_cost} руб.` : ""}</div>
        </div>
        <div style="display:flex; gap:4px;">
          ${editBtn}
          <button class="btn btn-sm" onclick="deleteOperation(${state.components.length - 1}, ${opIdx})" style="background:#e5484d; color:#fff;">✕</button>
        </div>
      </div>`;
    }).join("");
    app.innerHTML = `
      <h1>Компонент готов</h1>
      <div class="summary-line"><div class="name">${c.material.name}</div><div class="sum">${c.materialSum.toFixed(0)} руб.</div>
        <div class="detail">${calcDetailText(c.material.mode, c.material.rate, areaFor(c), c.material_length_m, c.height, c.width)}</div>
      </div>
      ${opsHtml}
      <div class="total"><span>Сумма компонента</span><span>${componentTotal(c).toFixed(0)} руб.</span></div>
      <div class="comp-actions" style="margin-top:10px;">
        <button class="btn btn-sm" id="editLast">Габариты</button>
        <button class="btn btn-sm" id="editMat">Материал</button>
        <button class="btn btn-sm" id="delComp" style="background:#e5484d; color:#fff;">Удалить</button>
      </div>
    `;
    if (state.product.multi) {
      app.innerHTML += `
        <button class="btn" id="more">Добавить компонент</button>
        <button class="btn btn-primary" id="done">Завершить изделие</button>
      `;
      document.getElementById("more").onclick = () => startComponent();
      document.getElementById("done").onclick = () => { goToStep("final"); };
    } else {
      app.innerHTML += `<button class="btn btn-primary" id="done">Завершить</button>`;
      document.getElementById("done").onclick = () => { goToStep("final"); };
    }
    document.getElementById("editLast").onclick = () => editComponent(state.components.length - 1);
    document.getElementById("editMat").onclick = () => editMaterial(state.components.length - 1);
    document.getElementById("delComp").onclick = () => deleteComponent(state.components.length - 1);
    return;
  }

  if (state.step === "final") {
    let compHtml = state.components.map((c, i) => {
      const opsHtml = c.ops.map((o, opIdx) => {
        const extraFieldHtml = o.mode === "lm"
          ? `<input type="number" step="0.01" class="inline-num" title="Длина, м" placeholder="Длина, м" value="${o.length_m || 0}" onchange="updateOperationField(${i},${opIdx},'length_m',this.value)">`
          : (o.mode === "grommet"
            ? `<input type="number" class="inline-num" title="Кол-во" placeholder="Кол-во" value="${o.grommet_count || 0}" onchange="updateOperationField(${i},${opIdx},'grommet_count',this.value)">`
            : "");
        const detail = calcDetailText(o.mode, o.rate, areaFor(c), o.length_m, c.height, c.width, o.grommet_count, o.spacing_cm, o.min_cost, o.sum);
        return `<div class="op-row" style="margin-left:14px; border-left:2px solid var(--tg-theme-hint-color,#cccccc); padding-left:10px; display:flex; justify-content:flex-start; align-items:center; gap:6px; flex-wrap:wrap;" title="${detail}">
          <div class="name" style="min-width:80px; margin-right:4px;">${o.name}</div>
          <input type="number" step="0.01" class="inline-num" title="Тариф" placeholder="Тариф" value="${o.rate}" onchange="updateOperationField(${i},${opIdx},'rate',this.value)">
          ${extraFieldHtml}
          <input type="number" step="0.01" class="inline-num" title="Приладка" placeholder="Приладка" value="${o.setup_cost || 0}" onchange="updateOperationField(${i},${opIdx},'setup_cost',this.value)">
          <div class="sum" style="min-width:60px; text-align:right;">${o.sum.toFixed(0)} руб.</div>
          <button class="btn btn-sm" onclick="deleteOperation(${i}, ${opIdx})" style="background:#e5484d; color:#fff;">✕</button>
        </div>`;
      }).join("");

      const lenFieldHtml = c.material.mode === "lm" ? `
        <div class="compact-field"><label>Длина, м</label><input type="number" step="0.01" id="compLen${i}" value="${c.material_length_m || ""}" placeholder="0" onchange="updateComponentDimensions(${i})"></div>
      ` : "";

      return `
        <div data-component-index="${i}" class="summary-line" style="padding-bottom:10px;">
          <div class="name-line" style="display:flex; justify-content:space-between; align-items:center;">
            <div style="display:flex; align-items:center; gap:6px;">
              <div class="name">${i + 1}. ${c.material.name}</div>
              <button class="icon-btn" title="Изменить материал" onclick="editMaterial(${i})">↻</button>
              <button class="icon-btn icon-btn-danger" title="Удалить компонент" onclick="deleteComponent(${i})">−</button>
            </div>
            <div class="sum">${componentTotal(c).toFixed(0)} руб.</div>
          </div>
          <div class="detail">${calcDetailText(c.material.mode, c.material.rate, areaFor(c), c.material_length_m, c.height, c.width)}</div>
          <div class="compact-row">
            <div class="compact-field"><label>Высота, мм</label><input type="number" id="compHeight${i}" value="${c.height || ""}" placeholder="0" onchange="updateComponentDimensions(${i})"></div>
            <div class="compact-field"><label>Ширина, мм</label><input type="number" id="compWidth${i}" value="${c.width || ""}" placeholder="0" onchange="updateComponentDimensions(${i})"></div>
            <div class="compact-field"><label>Тариф материала</label><input type="number" step="0.01" id="compRate${i}" value="${c.material.rate}" onchange="updateComponentDimensions(${i})"></div>
            <div class="compact-field"><label>Сумма</label><div style="font-weight:600; font-size:13px; padding:6px 0;" id="compMatSum${i}">${c.materialSum.toFixed(0)} руб.</div></div>
            ${lenFieldHtml}
          </div>
          ${opsHtml}
          <button class="icon-btn" title="Добавить операцию" onclick="addOperationToComponent(${i})" style="margin-top:8px;">+</button>
        </div>
      `;
    }).join("<div style='height:10px;'></div>");

    const payload = {
      product: state.product,
      components: state.components.map(c => ({
        material: c.material,
        height_mm: c.height,
        width_mm: c.width,
        qty: c.qty,
        material_length_m: c.material_length_m || 0,
        material_sum: c.materialSum,
        operations: c.ops,
        component_sum: componentTotal(c)
      })),
      total: grandTotal()
    };

    const actionHtml = tg
      ? `<button class="btn btn-primary" id="send">Отправить расчёт в чат</button>`
      : `<button class="btn btn-primary" id="send">Скачать JSON расчёта</button>
         <button class="btn secondary" id="sendXlsx" style="margin-top:6px;">Скачать Excel</button>
         <div class="hint" style="margin-top:8px;">Страница открыта не в Telegram — расчёт можно скачать файлом.</div>`;

    const emptyHint = state.components.length === 0
      ? `<div class="hint" style="margin-top:12px;">Материалов пока нет — нажмите «Добавить материал».</div>`
      : "";

    app.innerHTML = `
      <h1>${state.product.name}</h1>
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
        <label style="margin:0; font-size:13px; color:var(--tg-theme-hint-color,#999999);">Тираж, шт</label>
        <input type="number" id="productQty" value="${state.product.qty}" min="1" style="width:80px;" onchange="updateProductQty(this.value)">
      </div>
      <button class="btn" id="addMaterialBtn" style="background:var(--tg-theme-button-color,#2481cc); color:#fff; margin-bottom:12px;">+ Добавить материал</button>
      ${compHtml}
      ${emptyHint}
      <div class="summary-line" style="display:flex; justify-content:flex-start; gap:6px; background:transparent; padding:6px 0;">
        <span class="detail" style="font-size:13px;">Итого за изделие (1 шт):</span>
        <span class="detail" style="font-size:13px; font-weight:600;">${(grandTotal() / (state.product.qty || 1)).toFixed(0)} руб.</span>
      </div>
      <div class="total" style="justify-content:flex-start; gap:8px;"><span>Общая сумма:</span><span>${grandTotal().toFixed(0)} руб.</span></div>
      ${actionHtml}
    `;
    document.getElementById("addMaterialBtn").onclick = () => startComponent();
    document.getElementById("send").onclick = () => {
      if (tg) {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      } else {
        const json = JSON.stringify(payload, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "order.json";
        a.click();
        URL.revokeObjectURL(url);
      }
    };
    if (!tg) {
      document.getElementById("sendXlsx").onclick = () => downloadXlsx(payload);
    }
    return;
  }
}

function deleteOperation(componentIndex, opIndex) {
  state.components[componentIndex].ops.splice(opIndex, 1);
  render();
}

function perimeterFor(c) {
  return 2 * (c.height + c.width) / 1000;
}

function areaFor(c) {
  return (c.height / 1000) * (c.width / 1000);
}

function calcDetailText(mode, rate, area, lengthM, height, width, grommetCount, spacingCm, minCost, sum) {
  const dims = (height && width) ? `${height}x${width}мм · ` : "";
  let base;
  if (mode === "sqm") base = `${dims}${area.toFixed(4)} м² × ${rate} руб/м²`;
  else if (mode === "lm") base = `${dims}${(lengthM || 0).toFixed(2)} м × ${rate} руб/м.п.`;
  else if (mode === "grommet") base = `${dims}${grommetCount || 0} шт (шаг ${spacingCm || 30} см) × ${rate} руб/шт`;
  else base = `${dims}${rate} руб/шт`;
  if (minCost && sum !== undefined && Math.abs(sum - minCost) < 0.01) {
    base += ` · применён минимум ${minCost} руб.`;
  }
  return base;
}

function opSumFor(c, op) {
  let raw;
  if (op.mode === "sqm") {
    raw = areaFor(c) * state.product.qty * op.rate + (op.setup_cost || 0);
  } else if (op.mode === "lm") {
    raw = (op.length_m || 0) * state.product.qty * op.rate + (op.setup_cost || 0);
  } else if (op.mode === "grommet") {
    raw = (op.grommet_count || 0) * state.product.qty * op.rate + (op.setup_cost || 0);
  } else {
    raw = state.product.qty * op.rate + (op.setup_cost || 0);
  }
  return op.min_cost ? Math.max(raw, op.min_cost) : raw;
}

function editOperationLength(componentIndex, opIndex) {
  state.editingOp = { componentIndex, opIndex };
  goToStep("edit_operation_length");
}

function editOperationRate(componentIndex, opIndex) {
  state.editingOp = { componentIndex, opIndex };
  goToStep("edit_operation_rate");
}

function editOperationGrommet(componentIndex, opIndex) {
  state.editingOp = { componentIndex, opIndex };
  goToStep("edit_operation_grommet");
}

function deleteComponent(index) {
  state.components.splice(index, 1);
  expandedComponents.clear();
  if (state.components.length === 0) {
    // все компоненты удалены — возвращаемся к выбору материала для нового
    startComponent();
  } else {
    goToStep(state.step === "component_done" ? "final" : state.step);
  }
}

function editComponent(index) {
  const c = state.components.splice(index, 1)[0];
  state.draft = {
    material: c.material,
    height: c.height,
    width: c.width,
    qty: c.qty,
    ops: c.ops,
    material_length_m: c.material_length_m || 0
  };
  stepHistory = [];
  goToStep("dimensions");
}

function updateOperationField(compIndex, opIndex, field, value) {
  const c = state.components[compIndex];
  const op = c.ops[opIndex];
  if (field === "rate" || field === "setup_cost" || field === "length_m") {
    op[field] = parseFloat(value) || 0;
  } else if (field === "grommet_count") {
    op[field] = parseInt(value) || 0;
  }
  op.sum = opSumFor(c, op);
  render();
}

function updateComponentDimensions(i) {
  const c = state.components[i];
  const heightInput = document.getElementById("compHeight" + i);
  const widthInput = document.getElementById("compWidth" + i);
  const rateInput = document.getElementById("compRate" + i);
  const lenInput = document.getElementById("compLen" + i);
  if (heightInput) c.height = parseFloat(heightInput.value) || 0;
  if (widthInput) c.width = parseFloat(widthInput.value) || 0;
  if (rateInput) c.material.rate = parseFloat(rateInput.value) || 0;
  if (lenInput) c.material_length_m = parseFloat(lenInput.value) || 0;

  if (c.material.mode === "sqm") {
    c.materialSum = areaFor(c) * state.product.qty * c.material.rate;
  } else if (c.material.mode === "lm") {
    c.materialSum = (c.material_length_m || 0) * state.product.qty * c.material.rate;
  } else {
    c.materialSum = state.product.qty * c.material.rate;
  }
  c.ops.forEach(op => { op.sum = opSumFor(c, op); });

  render();
}

function updateProductQty(value) {
  state.product.qty = parseInt(value) || 1;
  state.components.forEach(c => {
    if (c.material.mode === "sqm") {
      c.materialSum = areaFor(c) * state.product.qty * c.material.rate;
    } else if (c.material.mode === "lm") {
      c.materialSum = (c.material_length_m || 0) * state.product.qty * c.material.rate;
    } else {
      c.materialSum = state.product.qty * c.material.rate;
    }
    c.ops.forEach(op => { op.sum = opSumFor(c, op); });
  });
  render();
}

function editMaterial(index) {
  const c = state.components.splice(index, 1)[0];
  state.draft = {
    material: null,
    height: c.height,
    width: c.width,
    qty: c.qty,
    ops: c.ops,
    material_length_m: c.material_length_m || 0
  };
  stepHistory = [];
  goToStep("material_search");
}

function addOperationToComponent(index) {
  const c = state.components.splice(index, 1)[0];
  state.draft = {
    material: c.material,
    height: c.height,
    width: c.width,
    qty: c.qty,
    ops: c.ops,
    material_length_m: c.material_length_m || 0
  };
  stepHistory = [];
  goToStep("operation_search");
}

function startComponent() {
  state.draft = { material: null, height: 0, width: 0, qty: 1, material_length_m: 0, ops: [] };
  goToStep("material_search");
}

function finishComponent() {
  // пересчитываем суммы операций от текущих габаритов/количества —
  // важно, если компонент редактировался и размеры могли измениться
  state.draft.ops.forEach(op => { op.sum = opSum(op); });
  state.draft.materialSum = materialSum();
  state.components.push(state.draft);
  goToStep("final");
}

function renderSearchScreen(catalog, title, placeholder, onSelect) {
  const app = document.getElementById("app");
  app.innerHTML = `
    <h1>${title}</h1>
    <input type="text" id="q" placeholder="${placeholder}" autofocus>
    <div class="list" id="list"></div>
  `;
  const input = document.getElementById("q");
  const list = document.getElementById("list");

  function renderList(query) {
    const q = query.trim().toLowerCase();
    const filtered = catalog.filter(x => x.name.toLowerCase().includes(q));
    list.innerHTML = "";
    filtered.forEach((item) => {
      const div = document.createElement("button");
      div.className = "item";
      div.innerHTML = `<div>${item.name}</div><div class="rate">${item.rate} ${unitLabel(item.mode)}</div>`;
      div.addEventListener("click", () => onSelect(item));
      list.appendChild(div);
    });
    if (filtered.length === 0) {
      list.innerHTML = '<div class="hint">Ничего не найдено</div>';
    }
  }

  input.addEventListener("input", (e) => renderList(e.target.value));
  renderList("");
}

function fetchJsonSafe(url, fallback) {
  return fetch(url, { cache: "no-store" })
    .then(r => r.ok ? r.json() : fallback)
    .catch(() => fallback);
}

Promise.all([
  fetch("materials.json?v=" + Date.now(), { cache: "no-store" }).then(r => r.json()),
  fetch("operations.json?v=" + Date.now(), { cache: "no-store" }).then(r => r.json()),
  fetchJsonSafe("material_operations.json?v=" + Date.now(), []),
  fetchJsonSafe("templates.json?v=" + Date.now(), [])
]).then(([m, o, link, tpl]) => {
  materials = m;
  operations = o;
  materialOperationsMap = {};
  link.forEach(entry => {
    materialOperationsMap[entry.material] = {
      operations: entry.operations || [],
      no_operations: !!entry.no_operations
    };
  });
  templates = tpl;
  render();
}).catch(() => {
  document.getElementById("app").innerHTML = "<div class='hint'>Не удалось загрузить справочники</div>";
});
</script>
