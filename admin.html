<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Редактор справочников</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
    padding: 24px;
    max-width: 720px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .hint { font-size: 13px; color: #777; margin-bottom: 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    padding: 8px 16px;
    border-radius: 8px;
    background: #e5e5e5;
    cursor: pointer;
    font-size: 14px;
    border: none;
  }
  .tab.active { background: #2481cc; color: #fff; }
  .file-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  button {
    padding: 9px 16px;
    border-radius: 8px;
    border: none;
    background: #2481cc;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  button.secondary { background: #e5e5e5; color: #1a1a1a; }
  button.danger { background: #e5484d; color: #fff; padding: 6px 10px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
  th, td { padding: 8px 10px; text-align: left; font-size: 13px; border-bottom: 1px solid #eee; }
  th { background: #eee; font-weight: 500; }
  input[type=text], input[type=number] {
    width: 100%;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 13px;
  }
  select {
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 13px;
  }
  .actions { margin-top: 16px; display: flex; gap: 8px; }
  .status { margin-top: 12px; font-size: 13px; color: #2481cc; }
</style>
</head>
<body>

<h1>Редактор справочников</h1>
<div class="hint">Работает прямо в браузере, ничего никуда не отправляет. Загрузите файл — отредактируйте — скачайте обратно.</div>

<div class="tabs">
  <button class="tab active" id="tab-mat">Материалы</button>
  <button class="tab" id="tab-op">Операции</button>
</div>

<div class="file-row">
  <input type="file" id="fileInput" accept=".json">
  <button class="secondary" id="newBtn">Начать с пустого списка</button>
</div>

<table>
  <thead>
    <tr>
      <th style="width:45%">Название</th>
      <th style="width:20%">Режим</th>
      <th style="width:20%">Тариф</th>
      <th style="width:15%"></th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<div class="actions">
  <button class="secondary" id="addRow">+ Добавить строку</button>
  <button id="download">Скачать JSON</button>
</div>

<div class="status" id="status"></div>

<script>
let mode = "materials";
let data = [];

const modeOptions = {
  materials: [["sqm", "за м²"], ["pc", "за шт"]],
  operations: [["sqm", "за м²"], ["pc", "за шт"], ["lm", "за пог. метр"]]
};

function setTab(newMode) {
  mode = newMode;
  document.getElementById("tab-mat").classList.toggle("active", mode === "materials");
  document.getElementById("tab-op").classList.toggle("active", mode === "operations");
  document.getElementById("status").textContent = "";
}

document.getElementById("tab-mat").onclick = () => setTab("materials");
document.getElementById("tab-op").onclick = () => setTab("operations");

function render() {
  const tbody = document.getElementById("rows");
  tbody.innerHTML = "";
  data.forEach((item, i) => {
    const tr = document.createElement("tr");

    const nameTd = document.createElement("td");
    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.value = item.name || "";
    nameInput.oninput = (e) => { data[i].name = e.target.value; };
    nameTd.appendChild(nameInput);

    const modeTd = document.createElement("td");
    const modeSelect = document.createElement("select");
    modeOptions[mode].forEach(([val, label]) => {
      const opt = document.createElement("option");
      opt.value = val;
      opt.textContent = label;
      if (item.mode === val) opt.selected = true;
      modeSelect.appendChild(opt);
    });
    modeSelect.onchange = (e) => { data[i].mode = e.target.value; };
    modeTd.appendChild(modeSelect);

    const rateTd = document.createElement("td");
    const rateInput = document.createElement("input");
    rateInput.type = "number";
    rateInput.step = "0.01";
    rateInput.value = item.rate ?? 0;
    rateInput.oninput = (e) => { data[i].rate = parseFloat(e.target.value) || 0; };
    rateTd.appendChild(rateInput);

    const delTd = document.createElement("td");
    const delBtn = document.createElement("button");
    delBtn.className = "danger";
    delBtn.textContent = "Удалить";
    delBtn.onclick = () => { data.splice(i, 1); render(); };
    delTd.appendChild(delBtn);

    tr.appendChild(nameTd);
    tr.appendChild(modeTd);
    tr.appendChild(rateTd);
    tr.appendChild(delTd);
    tbody.appendChild(tr);
  });
}

document.getElementById("addRow").onclick = () => {
  data.push({ name: "", mode: modeOptions[mode][0][0], rate: 0 });
  render();
};

document.getElementById("newBtn").onclick = () => {
  data = [];
  render();
  document.getElementById("status").textContent = "Начат пустой список.";
};

document.getElementById("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const parsed = JSON.parse(evt.target.result);
      if (!Array.isArray(parsed)) throw new Error("not an array");
      data = parsed;
      render();
      document.getElementById("status").textContent = `Загружено: ${file.name} (${data.length} строк)`;
    } catch (err) {
      document.getElementById("status").textContent = "Не удалось прочитать файл: это не корректный JSON-список.";
    }
  };
  reader.readAsText(file, "utf-8");
});

document.getElementById("download").onclick = () => {
  const cleaned = data
    .filter(item => item.name && item.name.trim())
    .map(item => ({ name: item.name.trim(), mode: item.mode, rate: item.rate }));
  const json = JSON.stringify(cleaned, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = mode === "materials" ? "materials.json" : "operations.json";
  a.click();
  URL.revokeObjectURL(url);
  document.getElementById("status").textContent = `Скачан файл: ${a.download}`;
};

render();
</script>

</body>
</html>
