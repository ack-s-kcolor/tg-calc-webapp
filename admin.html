<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Редактор справочников</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
    padding: 24px;
    max-width: 1100px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .hint { font-size: 13px; color: #777; margin-bottom: 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    padding: 8px 16px;
    border-radius: 8px;
    background: #e5e5e5;
    cursor: pointer;
    font-size: 14px;
    border: none;
  }
  .tab.active { background: #2481cc; color: #fff; }
  .file-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  .markup-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .markup-row input { width: 70px; padding: 6px 8px; border-radius: 6px; border: 1px solid #ccc; }
  button {
    padding: 9px 16px;
    border-radius: 8px;
    border: none;
    background: #2481cc;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  button.secondary { background: #e5e5e5; color: #1a1a1a; }
  button.danger { background: #e5484d; color: #fff; padding: 6px 10px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; font-size: 13px; }
  th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #eee; }
  th { background: #eee; font-weight: 500; font-size: 12px; }
  td.computed { color: #777; background: #fafafa; }
  input[type=text], input[type=number] {
    width: 100%;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 13px;
  }
  select { padding: 6px 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px; }
  .actions { margin-top: 16px; display: flex; gap: 8px; }
  .status { margin-top: 12px; font-size: 13px; color: #2481cc; }
  .section { display: none; }
  .section.active { display: block; }
</style>
</head>
<body>

<h1>Редактор справочников</h1>
<div class="hint">Работает прямо в браузере, ничего никуда не отправляет. Загрузите файл — отредактируйте — скачайте обратно.</div>

<div class="tabs">
  <button class="tab active" id="tab-mat">Материалы</button>
  <button class="tab" id="tab-op">Операции</button>
</div>

<!-- МАТЕРИАЛЫ -->
<div class="section active" id="section-mat">
  <div class="file-row">
    <input type="file" id="fileInputMat" accept=".json">
    <button class="secondary" id="newBtnMat">Начать с пустого списка</button>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:20%">Материал</th>
        <th style="width:12%">Поставщик</th>
        <th style="width:12%">Ссылка</th>
        <th style="width:9%">Ширина, мм</th>
        <th style="width:9%">Высота, мм</th>
        <th style="width:10%">Закупка листа, руб</th>
        <th style="width:8%">Площадь, м²</th>
        <th style="width:8%">Закупка, руб/м²</th>
        <th style="width:8%">Наценка, %</th>
        <th style="width:8%">Продажа, руб/м²</th>
        <th style="width:7%"></th>
      </tr>
    </thead>
    <tbody id="rowsMat"></tbody>
  </table>

  <div class="actions">
    <button class="secondary" id="addRowMat">+ Добавить материал</button>
    <button id="downloadMat">Скачать materials.json</button>
  </div>
  <div class="status" id="statusMat"></div>
</div>

<!-- ОПЕРАЦИИ -->
<div class="section" id="section-op">
  <div class="file-row">
    <input type="file" id="fileInputOp" accept=".json">
    <button class="secondary" id="newBtnOp">Начать с пустого списка</button>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:50%">Название операции</th>
        <th style="width:20%">Режим</th>
        <th style="width:20%">Тариф</th>
        <th style="width:10%"></th>
      </tr>
    </thead>
    <tbody id="rowsOp"></tbody>
  </table>

  <div class="actions">
    <button class="secondary" id="addRowOp">+ Добавить операцию</button>
    <button id="downloadOp">Скачать operations.json</button>
  </div>
  <div class="status" id="statusOp"></div>
</div>

<script>
let matData = [];
let opData = [];

function setTab(t) {
  document.getElementById("tab-mat").classList.toggle("active", t === "mat");
  document.getElementById("tab-op").classList.toggle("active", t === "op");
  document.getElementById("section-mat").classList.toggle("active", t === "mat");
  document.getElementById("section-op").classList.toggle("active", t === "op");
}
document.getElementById("tab-mat").onclick = () => setTab("mat");
document.getElementById("tab-op").onclick = () => setTab("op");

// ---------- Материалы ----------

function area(item) {
  return (parseFloat(item.width_mm) || 0) / 1000 * (parseFloat(item.height_mm) || 0) / 1000;
}
function purchasePerM2(item) {
  const a = area(item);
  return a > 0 ? (parseFloat(item.purchase_total) || 0) / a : 0;
}
function sellPerM2(item) {
  const percent = parseFloat(item.markup_percent);
  const factor = 1 + (isNaN(percent) ? 0 : percent) / 100;
  return purchasePerM2(item) * factor;
}

function renderMat() {
  const tbody = document.getElementById("rowsMat");
  tbody.innerHTML = "";
  matData.forEach((item, i) => {
    const tr = document.createElement("tr");

    function textCell(field, value) {
      const td = document.createElement("td");
      const input = document.createElement("input");
      input.type = "text";
      input.value = value || "";
      input.oninput = (e) => { matData[i][field] = e.target.value; renderMat(); };
      td.appendChild(input);
      return td;
    }
    function numCell(field, value) {
      const td = document.createElement("td");
      const input = document.createElement("input");
      input.type = "number";
      input.value = value ?? "";
      input.oninput = (e) => { matData[i][field] = e.target.value; renderMat(); };
      td.appendChild(input);
      return td;
    }

    tr.appendChild(textCell("name", item.name));
    tr.appendChild(textCell("supplier", item.supplier));
    tr.appendChild(textCell("link", item.link));
    tr.appendChild(numCell("width_mm", item.width_mm));
    tr.appendChild(numCell("height_mm", item.height_mm));
    tr.appendChild(numCell("purchase_total", item.purchase_total));

    const areaTd = document.createElement("td");
    areaTd.className = "computed";
    areaTd.textContent = area(item).toFixed(4);
    tr.appendChild(areaTd);

    const purchaseM2Td = document.createElement("td");
    purchaseM2Td.className = "computed";
    purchaseM2Td.textContent = purchasePerM2(item).toFixed(2);
    tr.appendChild(purchaseM2Td);

    tr.appendChild(numCell("markup_percent", item.markup_percent));

    const sellM2Td = document.createElement("td");
    sellM2Td.className = "computed";
    sellM2Td.textContent = sellPerM2(item).toFixed(2);
    tr.appendChild(sellM2Td);

    const delTd = document.createElement("td");
    const delBtn = document.createElement("button");
    delBtn.className = "danger";
    delBtn.textContent = "Удалить";
    delBtn.onclick = () => { matData.splice(i, 1); renderMat(); };
    delTd.appendChild(delBtn);
    tr.appendChild(delTd);

    tbody.appendChild(tr);
  });
}

document.getElementById("addRowMat").onclick = () => {
  matData.push({ name: "", supplier: "", link: "", width_mm: "", height_mm: "", purchase_total: "", markup_percent: 80 });
  renderMat();
};

document.getElementById("newBtnMat").onclick = () => {
  matData = [];
  renderMat();
  document.getElementById("statusMat").textContent = "Начат пустой список.";
};

document.getElementById("fileInputMat").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const parsed = JSON.parse(evt.target.result);
      if (!Array.isArray(parsed)) throw new Error("not array");
      // Файл materials.json хранит только name/mode/rate — при загрузке кладём rate
      // как продажную цену, а поля расчёта (поставщик, размер, закупка) оставляем пустыми
      // для донаполнения, если раньше их не было.
      matData = parsed.map(p => ({
        name: p.name || "",
        supplier: p.supplier || "",
        link: p.link || "",
        width_mm: p.width_mm || "",
        height_mm: p.height_mm || "",
        purchase_total: p.purchase_total || "",
        markup_percent: p.markup_percent !== undefined ? p.markup_percent : 80,
        _existing_rate: p.rate
      }));
      renderMat();
      document.getElementById("statusMat").textContent = `Загружено: ${file.name} (${matData.length} строк)`;
    } catch (err) {
      document.getElementById("statusMat").textContent = "Не удалось прочитать файл: это не корректный JSON-список.";
    }
  };
  reader.readAsText(file, "utf-8");
});

document.getElementById("downloadMat").onclick = () => {
  const cleaned = matData
    .filter(item => item.name && item.name.trim())
    .map(item => {
      const computedRate = sellPerM2(item);
      // если по материалу не заполнены размер/закупка (например, поштучный товар,
      // добавленный вручную), используем ранее сохранённую цену, если она была
      const rate = computedRate > 0 ? computedRate : (item._existing_rate || 0);
      return {
        name: item.name.trim(),
        mode: "sqm",
        rate: Math.round(rate * 100) / 100,
        supplier: item.supplier || "",
        link: item.link || "",
        width_mm: item.width_mm || "",
        height_mm: item.height_mm || "",
        purchase_total: item.purchase_total || "",
        markup_percent: item.markup_percent !== undefined ? item.markup_percent : 80
      };
    });
  const json = JSON.stringify(cleaned, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "materials.json";
  a.click();
  URL.revokeObjectURL(url);
  document.getElementById("statusMat").textContent = "Скачан файл: materials.json (со всеми столбцами)";
};

// ---------- Операции ----------

const opModeOptions = [["sqm", "за м²"], ["pc", "за шт"], ["lm", "за пог. метр"]];

function renderOp() {
  const tbody = document.getElementById("rowsOp");
  tbody.innerHTML = "";
  opData.forEach((item, i) => {
    const tr = document.createElement("tr");

    const nameTd = document.createElement("td");
    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.value = item.name || "";
    nameInput.oninput = (e) => { opData[i].name = e.target.value; };
    nameTd.appendChild(nameInput);

    const modeTd = document.createElement("td");
    const modeSelect = document.createElement("select");
    opModeOptions.forEach(([val, label]) => {
      const opt = document.createElement("option");
      opt.value = val;
      opt.textContent = label;
      if (item.mode === val) opt.selected = true;
      modeSelect.appendChild(opt);
    });
    modeSelect.onchange = (e) => { opData[i].mode = e.target.value; };
    modeTd.appendChild(modeSelect);

    const rateTd = document.createElement("td");
    const rateInput = document.createElement("input");
    rateInput.type = "number";
    rateInput.step = "0.01";
    rateInput.value = item.rate ?? 0;
    rateInput.oninput = (e) => { opData[i].rate = parseFloat(e.target.value) || 0; };
    rateTd.appendChild(rateInput);

    const delTd = document.createElement("td");
    const delBtn = document.createElement("button");
    delBtn.className = "danger";
    delBtn.textContent = "Удалить";
    delBtn.onclick = () => { opData.splice(i, 1); renderOp(); };
    delTd.appendChild(delBtn);

    tr.appendChild(nameTd);
    tr.appendChild(modeTd);
    tr.appendChild(rateTd);
    tr.appendChild(delTd);
    tbody.appendChild(tr);
  });
}

document.getElementById("addRowOp").onclick = () => {
  opData.push({ name: "", mode: "pc", rate: 0 });
  renderOp();
};

document.getElementById("newBtnOp").onclick = () => {
  opData = [];
  renderOp();
  document.getElementById("statusOp").textContent = "Начат пустой список.";
};

document.getElementById("fileInputOp").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const parsed = JSON.parse(evt.target.result);
      if (!Array.isArray(parsed)) throw new Error("not array");
      opData = parsed;
      renderOp();
      document.getElementById("statusOp").textContent = `Загружено: ${file.name} (${opData.length} строк)`;
    } catch (err) {
      document.getElementById("statusOp").textContent = "Не удалось прочитать файл: это не корректный JSON-список.";
    }
  };
  reader.readAsText(file, "utf-8");
});

document.getElementById("downloadOp").onclick = () => {
  const cleaned = opData
    .filter(item => item.name && item.name.trim())
    .map(item => ({ name: item.name.trim(), mode: item.mode, rate: item.rate }));
  const json = JSON.stringify(cleaned, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "operations.json";
  a.click();
  URL.revokeObjectURL(url);
  document.getElementById("statusOp").textContent = "Скачан файл: operations.json";
};

renderMat();
renderOp();
</script>

</body>
</html>
